name: Compatibilidade PHP

# Guard de compatibilidade: roda `php -l` em todos os arquivos do plugin em
# cada versao de PHP suportada. A versao MAIS BAIXA da matriz tem que bater
# com o "Requires PHP" do header do plugin (marreira-mcp-builders.php) e com
# o "Requires PHP" do readme.txt.
#
# Por que existe: um tipo de retorno `true|\WP_Error` (valido so a partir do
# PHP 8.2) entrou num plugin que declarava PHP 8.0 e derrubou o site de um
# usuario com "Cannot use 'true' as class name as it is reserved". Nada barrava
# isso antes de chegar em producao.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: php -l (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # 7.4 = piso declarado no header. 8.0/8.1 pegam o erro do tipo literal
        # `true`. 8.3/8.4 pegam depreciacoes de sintaxe nas versoes novas.
        php: ['7.4', '8.0', '8.1', '8.3', '8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Instala PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint de sintaxe
        run: bash scripts/lint-php.sh

  requires-php:
    name: Header bate com o piso da matriz
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Se alguem subir o "Requires PHP" sem subir a matriz (ou vice-versa), o
      # lint passaria numa versao que o plugin nem diz suportar. Este job trava
      # os dois juntos.
      - name: Confere Requires PHP do header e do readme
        run: |
          set -euo pipefail
          floor='7.4'

          header="$(grep -oP '^\s*\*\s*Requires PHP:\s*\K[0-9.]+' marreira-mcp-builders/marreira-mcp-builders.php)"
          readme="$(grep -oP '^Requires PHP:\s*\K[0-9.]+' marreira-mcp-builders/readme.txt)"

          echo "matriz (piso): $floor"
          echo "header do plugin: $header"
          echo "readme.txt: $readme"

          if [ "$header" != "$floor" ] || [ "$readme" != "$floor" ]; then
            echo "::error::Requires PHP dessincronizado. Header=$header readme=$readme piso da matriz=$floor. Atualize os tres juntos (inclusive a matriz em .github/workflows/php-compat.yml)."
            exit 1
          fi

          echo "OK: Requires PHP sincronizado em $floor."

      # O nome do filtro que o nucleo dispara traz o HOST do `Update URI` do
      # header. A classe Updater precisa registrar exatamente esse filtro, e por
      # isso repete a URI numa constante (ler o header em runtime custaria
      # carregar wp-admin/includes/plugin.php em toda requisicao). Se os dois
      # divergirem, o filtro nunca dispara e o plugin para de oferecer
      # atualizacao — sem erro, so silencio. Este job trava a igualdade.
      - name: Confere Update URI do header contra a constante do Updater
        run: |
          set -euo pipefail

          header="$(grep -oP '^\s*\*\s*Update URI:\s*\K\S+' marreira-mcp-builders/marreira-mcp-builders.php)"
          const="$(grep -oP "const UPDATE_URI\s*=\s*'\K[^']+" marreira-mcp-builders/includes/class-updater.php)"

          echo "header do plugin:      $header"
          echo "Updater::UPDATE_URI:   $const"

          if [ "$header" != "$const" ]; then
            echo "::error::Update URI dessincronizado. Header=$header Updater::UPDATE_URI=$const. Se divergirem, o filtro update_plugins_{host} nunca dispara e a atualizacao para de ser oferecida sem nenhum erro."
            exit 1
          fi

          echo "OK: Update URI sincronizado em $header."

      # O manifesto e gerado pelo build a partir do header. Se alguem commitar um
      # bump sem rodar o build, o update.json fica anunciando a versao velha e
      # ninguem recebe a atualizacao nova.
      - name: Confere update.json contra a versao do plugin
        run: |
          set -euo pipefail

          version="$(grep -oP '^\s*\*\s*Version:\s*\K\S+' marreira-mcp-builders/marreira-mcp-builders.php)"
          manifest="$(grep -oP '"version"\s*:\s*"\K[^"]+' docs/update.json)"

          echo "versao do plugin:  $version"
          echo "docs/update.json:  $manifest"

          if [ "$version" != "$manifest" ]; then
            echo "::error::docs/update.json esta em $manifest e o plugin em $version. Rode 'powershell -File scripts/build.ps1' e commite o update.json junto com o bump."
            exit 1
          fi

          echo "OK: update.json em $version."
